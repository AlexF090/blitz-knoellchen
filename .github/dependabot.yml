version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Sammel-PRs statt einer pro Paket — die Testsuite entscheidet ohnehin gemeinsam, und
      # Patch-Updates einzeln zu reviewen lohnt den Aufwand nicht.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
