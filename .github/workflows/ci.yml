name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    # svelte-kit sync leitet die Typen für $env/static/private aus den tatsächlich gesetzten
    # Variablen ab. Ohne sie meldet svelte-check jeden Import daraus als fehlenden Export —
    # lokal unsichtbar, weil dort eine .env liegt.
    env:
      BREVO_API_KEY: ci-dummy-key
      EMAIL_FROM: ci@example.com
      RECIPIENT_EMAIL_DEMO: ci-demo@example.com
      RECIPIENT_EMAIL_LIVE: ci-live@example.com
      LOCATIONIQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier & ESLint
        run: npm run lint

      - name: Typprüfung
        run: npm run check

  unit:
    name: Unit-Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright-Browser-Version ermitteln
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser-Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright-System-Dependencies installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Mit --coverage, damit die in vite.config.ts gepflegten Thresholds auch in CI greifen und
      # nicht nur bei einem lokalen Lauf mit explizitem Flag.
      - name: Unit-Tests mit Coverage
        run: npm run test:unit -- --run --coverage

  build:
    name: Production-Build
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ci-dummy-key
      EMAIL_FROM: ci@example.com
      RECIPIENT_EMAIL_DEMO: ci-demo@example.com
      RECIPIENT_EMAIL_LIVE: ci-live@example.com
      LOCATIONIQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E-Tests
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ci-dummy-key
      EMAIL_FROM: ci@example.com
      RECIPIENT_EMAIL_DEMO: ci-demo@example.com
      RECIPIENT_EMAIL_LIVE: ci-live@example.com
      LOCATIONIQ_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright-Browser-Version ermitteln
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser-Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright-System-Dependencies installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E-Tests
        run: npx playwright test

      - name: Playwright-Report bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
